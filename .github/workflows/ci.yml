name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          python -m pytest tests/test_maxsat_registry.py tests/test_subprocess_utils.py \
            tests/test_maxsat_distance.py tests/test_distance_from_bottom.py \
            tests/test_distance_from_top.py tests/test_distance_css_split.py \
            tests/test_log_encoding.py tests/test_basic.py tests/test_tseitin_xor.py \
            tests/test_tanner_pruning.py -q
