[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdistsat"
version = "0.2.0"
description = "SAT/MaxSAT solver benchmark for quantum CSS code minimum distance (QDistSAT)."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = [
    "python-sat>=0.1.7.dev0,<2",
    "pycryptosat>=5.10,<6,!=5.11.23",
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
benchmark = [
    "z3-solver>=4.12",
    "cvc5>=1.2",
]

[project.urls]
Homepage = "https://github.com/guluchen/QDistSAT"
Repository = "https://github.com/guluchen/QDistSAT"

[project.scripts]
precompute-logicals = "qecc_sat.cli.precompute_logical_bases:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
